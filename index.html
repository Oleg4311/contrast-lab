<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contrast Lab — проверка контраста WCAG</title>
<meta name="description" content="Проверка контраста цветов по WCAG 2.1 с подбором ближайшего доступного цвета.">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mut:#5b6573;--line:#dde1e7;--ok:#17803d;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--ink:#eef0f3;--mut:#9aa4b2;--line:#2c323b;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
.in{display:flex;gap:8px}
input[type=color]{width:48px;height:42px;padding:2px;border:1px solid var(--line);border-radius:8px;background:none}
input[type=text]{flex:1;min-width:0;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-family:ui-monospace,Consolas,monospace}
input.err{border-color:var(--bad)}
.preview{border-radius:12px;padding:20px;border:1px solid var(--line)}
.preview b{font-size:1.5rem;display:block}
.ratio{font-size:2.4rem;font-weight:700;margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
.badge{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:.85rem}
.badge strong{display:block;font-size:1rem}
.pass strong{color:var(--ok)}.fail strong{color:var(--bad)}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--mut)}
.sug{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:8px;border:1px solid var(--line)}
footer{color:var(--mut);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<main>
<h1>Contrast Lab</h1>
<p class="sub">Проверка контраста текста и фона по WCAG 2.1.</p>

<div class="card">
  <div class="row">
    <div><label for="fgT">Цвет текста</label><div class="in"><input type="color" id="fgC" aria-label="Выбрать цвет текста палитрой"><input type="text" id="fgT" maxlength="7" spellcheck="false"></div></div>
    <div><label for="bgT">Цвет фона</label><div class="in"><input type="color" id="bgC" aria-label="Выбрать цвет фона палитрой"><input type="text" id="bgT" maxlength="7" spellcheck="false"></div></div>
  </div>
  <p style="margin:12px 0 0"><button id="swap" type="button">⇄ Поменять местами</button></p>
</div>

<div class="card">
  <p class="ratio" id="ratio">—</p>
  <div class="grid" id="badges"></div>
</div>

<div class="card preview" id="preview">
  <b>Пример заголовка</b>
  <span>Обычный текст на выбранном фоне. The quick brown fox jumps over the lazy dog.</span>
</div>

<div class="card" id="sugCard" hidden>
  <div class="sug">
    <div class="sw" id="sugSw"></div>
    <div><div>Ближайший цвет текста с контрастом ≥ 4.5 (AA):</div><code id="sugHex"></code></div>
    <button id="apply" type="button">Применить</button>
  </div>
</div>

<footer>Формулы WCAG 2.1: относительная яркость и (L1+0.05)/(L2+0.05).</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const parse=h=>{h=h.trim();if(/^#?[0-9a-f]{3}$/i.test(h)){h=h.replace('#','').replace(/./g,'$&$&')}else if(/^#?[0-9a-f]{6}$/i.test(h)){h=h.replace('#','')}else return null;return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const hex=c=>'#'+c.map(v=>Math.round(Math.min(255,Math.max(0,v))).toString(16).padStart(2,'0')).join('');
const lum=c=>{const[r,g,b]=c.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
// ближайший по яркости оттенок: смешиваем с чёрным/белым, пока не пройдёт порог
function suggest(fg,bg,min){
  if(ratio(fg,bg)>=min)return null;
  const best=[];
  for(const t of[[0,0,0],[255,255,255]]){
    for(let i=1;i<=100;i++){const c=fg.map((v,k)=>v+(t[k]-v)*i/100);if(ratio(c,bg)>=min){best.push(c);break}}
  }
  if(!best.length)return null;
  const d=c=>c.reduce((s,v,k)=>s+(v-fg[k])**2,0);
  return best.sort((a,b)=>d(a)-d(b))[0];
}
let sug=null;
function update(){
  const fg=parse($('fgT').value),bg=parse($('bgT').value);
  $('fgT').classList.toggle('err',!fg);$('bgT').classList.toggle('err',!bg);
  if(!fg||!bg)return;
  $('fgC').value=hex(fg);$('bgC').value=hex(bg);
  const r=ratio(fg,bg);$('ratio').textContent=r.toFixed(2)+' : 1';
  const t=[['AA текст',4.5],['AA крупный',3],['AAA текст',7],['AAA крупный',4.5]];
  $('badges').innerHTML=t.map(([n,m])=>`<div class="badge ${r>=m?'pass':'fail'}">${n}<strong>${r>=m?'Пройдено':'Не пройдено'}</strong>≥ ${m}</div>`).join('');
  const p=$('preview');p.style.color=hex(fg);p.style.background=hex(bg);
  sug=suggest(fg,bg,4.5);$('sugCard').hidden=!sug;
  if(sug){$('sugSw').style.background=hex(sug);$('sugHex').textContent=hex(sug)}
  history.replaceState(null,'','#'+hex(fg).slice(1)+'-'+hex(bg).slice(1));
}
['fgT','bgT'].forEach(i=>$(i).addEventListener('input',update));
$('fgC').addEventListener('input',e=>{$('fgT').value=e.target.value;update()});
$('bgC').addEventListener('input',e=>{$('bgT').value=e.target.value;update()});
$('swap').onclick=()=>{[$('fgT').value,$('bgT').value]=[$('bgT').value,$('fgT').value];update()};
$('apply').onclick=()=>{if(sug){$('fgT').value=hex(sug);update()}};
// Цвета берутся из хэша при загрузке и при его изменении (вставили другую ссылку в той же вкладке)
function fromHash(){
  const m=location.hash.match(/^#([0-9a-f]{6})-([0-9a-f]{6})$/i);
  $('fgT').value=m?'#'+m[1]:'#767676';$('bgT').value=m?'#'+m[2]:'#ffffff';
  update();
}
window.addEventListener('hashchange',fromHash);
fromHash();
</script>
</body>
</html>
